{% assign github_readme_stats_url = site.github_readme_stats_url | default: "https://github-readme-stats.vercel.app" %}

<div class="repo p-2 text-center">
  <a href="https://github.com/{{ include.username }}">
    <img class="repo-img-light w-100" alt="{{ include.username }}" src="{{ github_readme_stats_url }}/api/?username={{ include.username }}&theme={{ site.repo_theme_light }}&show_icons=true">
    <img class="repo-img-dark w-100" alt="{{ include.username }}" src="{{ github_readme_stats_url }}/api/?username={{ include.username }}&theme={{ site.repo_theme_dark }}&show_icons=true">
  </a>
</div>
