{% if page.alternate_url and page.alternate_lang %}
<script>
  (function () {
    var current = {{ page.lang | default: site.lang | jsonify }};
    var alternate = {{ page.alternate_url | relative_url | jsonify }};
    var alternateLang = {{ page.alternate_lang | jsonify }};
    var saved = null;

    try { saved = localStorage.getItem("site-language"); } catch (error) {}

    if (current === "en" && alternateLang === "zh-CN") {
      if (saved === "zh-CN" || (!saved && /^zh\b/i.test(navigator.language || ""))) {
        try { localStorage.setItem("site-language", "zh-CN"); } catch (error) {}
        window.location.replace(alternate);
        return;
      }
    }

    if (!saved || current === "zh-CN") {
      try { localStorage.setItem("site-language", current); } catch (error) {}
    }

    document.addEventListener("DOMContentLoaded", function () {
      var link = document.querySelector("[data-language-switch]");
      if (!link) return;
      link.addEventListener("click", function () {
        try { localStorage.setItem("site-language", alternateLang); } catch (error) {}
      });
    });
  })();
</script>
{% endif %}
